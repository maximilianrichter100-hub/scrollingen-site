<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finde dein Haus · Stadtkarte</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#a9d674;color:#18234c;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;touch-action:none;cursor:grab}header{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:min(92%,500px);background:#18234c;color:white;border-radius:20px;padding:18px;box-shadow:0 10px 40px #18234c44}h1{font-size:22px;margin:0 0 12px}form{display:flex;gap:8px}input{min-width:0;flex:1;border:0;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:12px;background:#ffca53;color:#18234c;font-weight:800;cursor:pointer}#result{font-size:13px;margin:12px 0 0}nav{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:8px}#hint{position:absolute;bottom:85px;text-align:center;width:100%;font-size:12px;pointer-events:none}</style></head><body><canvas id="map" width="864" height="1536"></canvas><header><h1 id="title">Deine Stadt</h1><form id="search"><input id="query" aria-label="Bewohnername" placeholder="@dein_name" maxlength="80"><button>Suchen</button></form><p id="result" role="status">Jedes Haus gehört einem Bewohner.</p></header><div id="hint">Ziehen zum Bewegen · Mausrad oder + / − zum Zoomen</div><nav><button id="minus" aria-label="Verkleinern">−</button><button id="home">Übersicht</button><button id="plus" aria-label="Vergrößern">+</button></nav><script src="data.js"></script><script src="scene.js"></script><script>
const c=document.getElementById('map');let s=window.CITY_DATA,view={x:530,y:700,z:.48},drag;function draw(){CityScene.map(c,s,view)}function zoom(v){view.z=Math.max(.04,Math.min(5,view.z*v));draw()}function home(){view={x:530,y:700,z:.48};draw()}function setData(data){s=data;document.getElementById('title').textContent=s.city+' · '+s.total.toLocaleString('de-DE')+' Einwohner';draw()}setData(s);
document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=document.getElementById('query').value.trim().replace(/^@/,'').toLowerCase();let matches=s.residents.filter(r=>q&&r.handle.toLowerCase()===q);if(!matches.length)matches=s.residents.filter(r=>q&&r.handle.toLowerCase().includes(q));const r=matches[0],el=document.getElementById('result');if(!r){el.textContent='Noch kein Haus mit diesem Namen gefunden.';return}let p=CityScene.pos(r.plot);view={x:p.x,y:p.y+100,z:2.5,selected:r};const near=s.residents.filter(n=>n.handle&&n.plot!==r.plot&&Math.floor((n.plot-1)/50)===Math.floor((r.plot-1)/50)).sort((a,b)=>Math.abs(a.plot-r.plot)-Math.abs(b.plot-r.plot)).slice(0,2);el.textContent=`@${r.handle} · Platz ${r.plot} · ${p.district===0?'OG-Viertel':'Viertel '+(p.district+1)}. Nachbarn: ${near.map(n=>'@'+n.handle).join(', ')||'ziehen bald ein'}.`+(matches.length>1?` ${matches.length} Treffer; vollständigen Namen eingeben.`:'');draw()};
document.getElementById('plus').onclick=()=>zoom(1.3);document.getElementById('minus').onclick=()=>zoom(1/1.3);document.getElementById('home').onclick=home;
function factor(){return Math.min(innerWidth/576,innerHeight/1024)}c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;view.x-=(e.clientX-drag.x)/factor()/view.z;view.y-=(e.clientY-drag.y)/factor()/view.z;drag={x:e.clientX,y:e.clientY};draw()};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12)};
const requestedName=new URLSearchParams(location.search).get('name');if(requestedName){document.getElementById('query').value=requestedName;document.getElementById('search').requestSubmit();}</script></body></html>
